<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery embed</title>
    <style>
      html,
      body,
      #gallery {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #8f8f8f;
      }
    </style>
  </head>
  <body>
    <div id="gallery"></div>
    <script type="module">
      import { mountGallery } from "./src/lib.ts";

      const colors = [
        "#f2f2f2",
        "#ff4d2e",
        "#111111",
        "#3b7dff",
        "#e8e8e8",
        "#18c964",
        "#0a0a0a",
        "#ffd60a",
      ];
      const upstairs = ["#7c5cff", "#00d4c8", "#ff8a3d", "#f5f5f5"];
      const rooftop = ["#1a1a1a", "#ff2d55", "#f2f2f2"];

      function card(label, color, ink) {
        const canvas = document.createElement("canvas");
        canvas.width = 900;
        canvas.height = 1600;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, 900, 1600);
        ctx.fillStyle = ink;
        ctx.font = "700 220px Helvetica, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, 450, 800);
        return canvas.toDataURL("image/jpeg", 0.9);
      }

      function deck(list, inkFor) {
        return list.map((color, i) => ({
          src: card(String(i + 1).padStart(2, "0"), color, inkFor(color, i)),
        }));
      }

      mountGallery("#gallery", {
        ratio: "landscape",
        distribution: "ring",
        backgrounds: ["#8f8f8f", "#1c3a2a", "#0a2a44"],
        distortion: 0.05,
        chromaticAberration: 0.002,
        overscan: 1.75,
        cameraZoom: 0.83,
        focusZoom: 1,
        spinFriction: 0.15,
        cornerRadius: 0.04,
        axisTilt: -5,
        ringTilt: -13,
        rings: [
          deck(colors, (color, i) => (i % 2 === 0 ? "#111" : "#fff")),
          deck(upstairs, (color, i) => (i % 2 === 0 ? "#fff" : "#111")),
          deck(rooftop, (color, i) => (color === "#f2f2f2" ? "#111" : "#fff")),
        ],
      });
    </script>
  </body>
</html>
