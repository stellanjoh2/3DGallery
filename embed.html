<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery embed</title>
    <style>
      html,
      body,
      #gallery {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #8f8f8f;
      }
    </style>
  </head>
  <body>
    <div id="gallery"></div>
    <script type="module">
      import { mountGallery } from "./src/lib.ts";

      const colors = [
        "#f2f2f2",
        "#ff4d2e",
        "#111111",
        "#3b7dff",
        "#e8e8e8",
        "#18c964",
        "#0a0a0a",
        "#ffd60a",
      ];

      function card(label, color, ink) {
        const canvas = document.createElement("canvas");
        canvas.width = 900;
        canvas.height = 1600;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, 900, 1600);
        ctx.fillStyle = ink;
        ctx.font = "700 220px Helvetica, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, 450, 800);
        return canvas.toDataURL("image/jpeg", 0.9);
      }

      mountGallery("#gallery", {
        ratio: "portrait",
        distribution: "ring",
        background: "#8f8f8f",
        distortion: 0.15,
        chromaticAberration: 0.002,
        overscan: 1.75,
        cameraZoom: 0.83,
        focusZoom: 0.65,
        spinFriction: 0.15,
        cornerRadius: 0.04,
        axisTilt: -5,
        ringTilt: -13,
        items: colors.map((color, i) => ({
          src: card(String(i + 1).padStart(2, "0"), color, i % 2 === 0 ? "#111" : "#fff"),
        })),
      });
    </script>
  </body>
</html>
